<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Silicon Trace Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="purple-trace" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F293D" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#00F2FE" fill-opacity="0.25"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Silicon Bus & Circuit Traces (Left Side) -->
  <g stroke="url(#cyan-glow)" stroke-width="1.8" fill="none">
    <path d="M -20,60 L 120,60 L 180,120 L 320,120"/>
    <path d="M -20,80 L 100,80 L 150,130 L 260,130 L 290,160"/>
    <path d="M 40,240 L 140,240 L 190,190 L 300,190"/>
    <path d="M -20,280 L 110,280 L 160,230 L 340,230"/>
  </g>

  <!-- Via Pads (Left Side) -->
  <g fill="#00F2FE" filter="url(#glow)">
    <circle cx="320" cy="120" r="3.5"/>
    <circle cx="290" cy="160" r="3.5"/>
    <circle cx="300" cy="190" r="3.5"/>
    <circle cx="340" cy="230" r="3.5"/>
    <circle cx="180" cy="120" r="2.5" fill="#8B5CF6"/>
    <circle cx="190" cy="190" r="2.5" fill="#8B5CF6"/>
  </g>

  <!-- Silicon Bus & Circuit Traces (Right Side) -->
  <g stroke="url(#purple-trace)" stroke-width="1.8" fill="none">
    <path d="M 1220,60 L 1080,60 L 1020,120 L 880,120"/>
    <path d="M 1220,90 L 1100,90 L 1040,150 L 910,150"/>
    <path d="M 1160,250 L 1060,250 L 1000,190 L 870,190"/>
    <path d="M 1220,280 L 1090,280 L 1030,220 L 850,220"/>
  </g>

  <!-- Via Pads (Right Side) -->
  <g fill="#8B5CF6" filter="url(#glow)">
    <circle cx="880" cy="120" r="3.5" fill="#00F2FE"/>
    <circle cx="910" cy="150" r="3.5"/>
    <circle cx="870" cy="190" r="3.5"/>
    <circle cx="850" cy="220" r="3.5" fill="#00F2FE"/>
    <circle cx="1020" cy="120" r="2.5"/>
    <circle cx="1000" cy="190" r="2.5"/>
  </g>

  <!-- Center Die Accent Frame -->
  <rect x="360" y="35" width="480" height="250" rx="12" fill="#0B1120" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="370" y="45" width="460" height="230" rx="8" fill="none" stroke="#00F2FE" stroke-opacity="0.2" stroke-dasharray="8 6"/>

  <!-- IC Corner Marker Pins -->
  <g fill="#00F2FE" opacity="0.7">
    <rect x="368" y="43" width="8" height="2"/>
    <rect x="368" y="43" width="2" height="8"/>
    <rect x="824" y="43" width="8" height="2"/>
    <rect x="830" y="43" width="2" height="8"/>
    <rect x="368" y="275" width="8" height="2"/>
    <rect x="368" y="269" width="2" height="8"/>
    <rect x="824" y="275" width="8" height="2"/>
    <rect x="830" y="269" width="2" height="8"/>
  </g>

  <!-- Center Typography -->
  <!-- Name -->
  <text x="600" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="1.5">
    VINAYAK S. SALUNKE
  </text>

  <!-- Micro-Badge / Terminal Prompt -->
  <g transform="translate(600, 150)">
    <rect x="-175" y="-14" width="350" height="26" rx="13" fill="#0F172A" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.6"/>
    <text x="0" y="4" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="12.5" font-weight="600" fill="#00F2FE" letter-spacing="1">
      RTL • FPGA • ASIC • ANALOG IC
    </text>
  </g>

  <!-- Specialization Headline -->
  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    B.Tech Electronics Engineering (VLSI Design &amp; Technology) | VIT Chennai
  </text>

  <!-- Tagline -->
  <text x="600" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-style="italic" font-weight="400" fill="#38BDF8">
    "Turning logic into silicon, one bit at a time."
  </text>
</svg>
